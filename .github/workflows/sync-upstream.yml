name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# The automatic GITHUB_TOKEN is not used for the push (it cannot touch
# .github/workflows/), so it only needs read access here.
permissions:
  contents: read

jobs:
  sync:
    name: Merge upstream main
    if: github.repository == 'Febrile-JoJoo/BMAD-METHOD'
    runs-on: ubuntu-latest
    steps:
      # Plain git only: this repository's Actions policy allows no
      # third-party actions, not even actions/checkout.
      - name: Merge upstream main into fork main
        env:
          # Fine-grained personal access token (repository secret) with
          # Contents: read/write and Workflows: read/write on this fork.
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          FORK: ${{ github.repository }}
          UPSTREAM: bmad-code-org/BMAD-METHOD
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Repository secret UPSTREAM_SYNC_TOKEN is not set."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Both repositories are public, so reading needs no token.
          git clone -q --branch main "https://github.com/${FORK}.git" fork
          cd fork
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch -q upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream main."
            exit 0
          fi

          # "[skip ci]" keeps this fork's other workflows (docs deploy,
          # quality, publish) from running on the merge commit. They are
          # meant for the upstream repository, not for this fork.
          if ! git merge --no-ff --no-edit -m "Merge upstream main [skip ci]" upstream/main; then
            echo "::error::Merge conflict with upstream main. Resolve it manually (for example with the 'Sync fork' button on GitHub)."
            exit 1
          fi

          # Only the push needs the token. Actions masks its value in the logs.
          git push -q "https://x-access-token:${SYNC_TOKEN}@github.com/${FORK}.git" HEAD:main
          echo "Merged upstream main into fork main."
